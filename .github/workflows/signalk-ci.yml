name: Signal K Plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      node-versions: '["22", "24"]'
      format-check-command: npm run format:check
      # The Signal K integration harness cannot install the companion plugin
      # declared in `signalk.requires` (signalk-container), so the integration
      # check fails structurally rather than for any real defect.
      enable-signalk-integration: false
